<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07131a">
<title>Cosmic AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"></script>
<style>
:root{--c:#3accff;--c2:#8fecff;--bg:#07131a;--b:rgba(58,204,255,.28);--t:#eafaff;--m:#91b7c2}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:14px Arial;color:var(--t);background:var(--bg) url('https://i.makeagif.com/media/8-02-2016/yYXxa_.gif') center/cover fixed}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(135deg,rgba(3,13,18,.92),rgba(4,28,38,.74))}
button,textarea,select{font:inherit}button{cursor:pointer}
#app{position:relative;z-index:1;height:100%;display:flex}
.side{width:280px;padding:18px;border-right:1px solid var(--b);background:rgba(2,12,17,.86);backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:10px}
.brand{padding:8px 6px 18px;color:var(--c);font-weight:900;letter-spacing:2px}.brand b{display:inline-grid;place-items:center;width:34px;height:34px;margin-right:8px;border:1px solid var(--b);border-radius:12px}
.new,.sidebtn,.icon,.send{border:1px solid var(--b);border-radius:11px;background:rgba(58,204,255,.07);color:var(--c2);padding:10px;font-weight:800}.sidebtn{text-align:left;background:transparent;color:var(--m)}
.label{font-size:10px;color:#5d8a96;letter-spacing:1.5px;margin:14px 4px 3px}.list{flex:1;overflow:auto}.item{padding:10px;border-radius:10px;color:#b7d8df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item.active{background:rgba(58,204,255,.1);border:1px solid var(--b)}
main{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}.top{height:64px;padding:0 24px;border-bottom:1px solid rgba(58,204,255,.13);display:flex;align-items:center;justify-content:space-between;background:rgba(2,13,18,.45);backdrop-filter:blur(14px);font-size:12px;font-weight:900;letter-spacing:1.8px}.icon{width:38px;height:38px;padding:0}
.messages{flex:1;overflow:auto;padding:28px 20px 150px}.empty{height:100%;display:grid;place-items:center;text-align:center}.empty div{max-width:620px}.orb{font-size:35px;color:var(--c)}h1{font-size:clamp(32px,5vw,54px);color:var(--c);letter-spacing:3px;text-shadow:0 0 24px rgba(58,204,255,.5);margin:12px}.empty p{color:var(--m);line-height:1.6}
.msg{width:min(900px,100%);margin:0 auto 22px}.head{font-size:9px;color:#67aab9;font-weight:900;letter-spacing:1px;margin-bottom:7px;text-transform:uppercase}.bubble{width:fit-content;max-width:88%;padding:14px 16px;border-radius:16px;line-height:1.6;background:rgba(3,18,25,.68);border:1px solid rgba(58,204,255,.12);overflow-wrap:anywhere}.user .bubble{margin-left:auto;background:rgba(58,204,255,.1);border-color:rgba(58,204,255,.2)}
.bubble pre{overflow:auto;background:#081116;padding:13px;border-radius:9px}.bubble code{background:rgba(0,0,0,.3);padding:2px 4px;border-radius:4px}
.working{min-width:300px;padding:2px 0}.working-top{display:flex;align-items:center;gap:10px;color:var(--c2);font-weight:900}.pulse{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 0 0 rgba(58,204,255,.55);animation:pulse 1.4s infinite}.working-text{min-width:150px}.dots span{display:inline-block;animation:dot 1.2s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}.working-bar{height:3px;margin-top:12px;border-radius:99px;background:rgba(58,204,255,.1);overflow:hidden}.working-bar i{display:block;width:38%;height:100%;border-radius:99px;background:var(--c);animation:workbar 1.7s ease-in-out infinite}
.activity{margin-top:13px;border-top:1px solid rgba(58,204,255,.1);padding-top:10px}.activity-toggle{display:flex;align-items:center;gap:7px;border:0;background:transparent;color:#78aab5;font-size:11px;font-weight:800;padding:2px 0}.activity-toggle:hover{color:var(--c2)}.chevron{display:inline-block;transition:transform .2s}.activity.open .chevron{transform:rotate(90deg)}.activity-list{display:none;margin-top:9px;padding-left:3px}.activity.open .activity-list{display:block}.activity-step{display:flex;gap:9px;align-items:flex-start;padding:6px 0;color:#7faeb8;font-size:11px;line-height:1.45}.activity-step .mark{flex:0 0 14px;text-align:center;color:var(--c)}.activity-step.active .mark{animation:activityPulse 1s infinite}.activity-step.active{color:#bdeaf2}.activity-step.done .mark:after{content:'✓'}.activity-step.active .mark:after{content:'◌'}.activity-step.pending .mark:after{content:'○'}.activity-file{color:var(--c2);font-family:monospace}
.composer{position:absolute;bottom:0;left:0;right:0;padding:18px 20px 20px;background:linear-gradient(transparent,rgba(3,15,21,.97) 35%)}.box{width:min(900px,100%);margin:auto;padding:10px;border:1px solid var(--b);border-radius:18px;background:rgba(4,21,28,.92);backdrop-filter:blur(18px);display:flex;gap:8px;align-items:flex-end}textarea{flex:1;min-height:40px;max-height:180px;resize:none;border:0;outline:0;background:transparent;color:var(--t);padding:10px 4px}select{height:40px;max-width:245px;border:1px solid var(--b);border-radius:10px;background:#071a22;color:var(--c2);padding:0 8px;font-size:10px;font-weight:800}.send{width:40px;height:40px;padding:0}.send:disabled{opacity:.45;cursor:not-allowed}.status{font-size:10px;color:#78aab5;text-align:center;margin-top:7px}.error{color:#ff9d9d}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(58,204,255,.5)}70%{box-shadow:0 0 0 9px rgba(58,204,255,0)}100%{box-shadow:0 0 0 0 rgba(58,204,255,0)}}@keyframes dot{0%,60%,100%{opacity:.2;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}@keyframes workbar{0%{transform:translateX(-130%)}100%{transform:translateX(280%)}}@keyframes activityPulse{50%{opacity:.35}}
@media(max-width:560px){.side{position:absolute;z-index:5;height:100%;transform:translateX(-102%)}.side.open{transform:none}.box{flex-wrap:wrap}.box textarea{flex-basis:calc(100% - 48px)}select{max-width:none;flex:1}.working{min-width:0}}
</style>
</head>
<body>
<div id="app">
<aside class="side" id="side"><div class="brand"><b>✦</b>COSMIC AI</div><button class="new" onclick="newChat()">＋ New chat</button><button class="sidebtn" onclick="clearHistory()">Clear history</button><div class="label">RECENT</div><div class="list" id="list"></div></aside>
<main><header class="top"><span id="title">COSMIC AI</span><button class="icon" onclick="toggleSide()">☰</button></header><section class="messages" id="messages"></section>
<div class="composer"><div class="box"><textarea id="prompt" rows="1" placeholder="Message Cosmic AI..."></textarea><select id="model" aria-label="Choose AI model"><option value="openrouter/free">Cosmic AI — Auto</option><option value="google/gemma-4-31b-it:free">Gemma 4 31B — Free</option><option value="google/gemma-4-26b-a4b-it:free">Gemma 4 26B — Free</option><option value="nvidia/nemotron-3-super-120b-a12b:free">Nemotron 3 Super — Free</option><option value="nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free">Nemotron 3 Nano Omni — Free</option></select><button class="send" id="send" onclick="send()">➜</button></div><div class="status" id="status">Free AI models • secure server connection</div></div>
</main></div>
<script>
const ENDPOINT='https://cosmicv2.v75ultimate.workers.dev/api/ai',CH='cosmic_chats',AC='cosmic_active';
let chats=JSON.parse(localStorage.getItem(CH)||'{}'),active=localStorage.getItem(AC)||null,busy=false,ctrl=null,workingTimer=null,activityTimer=null;
const $=id=>document.getElementById(id);
const MODEL_NAMES={'openrouter/free':'Cosmic AI','google/gemma-4-31b-it:free':'Gemma 4 31B','google/gemma-4-26b-a4b-it:free':'Gemma 4 26B','nvidia/nemotron-3-super-120b-a12b:free':'Nemotron 3 Super','nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free':'Nemotron 3 Nano Omni'};
function save(){localStorage.setItem(CH,JSON.stringify(chats));active?localStorage.setItem(AC,active):localStorage.removeItem(AC)}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function newChat(){active=id();chats[active]={title:'New chat',history:[]};save();render();$('prompt').focus()}
function ensure(){if(!active||!chats[active])newChat()}
function clearHistory(){chats={};active=null;save();render()}
function toggleSide(){$('side').classList.toggle('open')}
function content(c){return typeof c==='string'?c:Array.isArray(c)?c.map(x=>x.type==='text'?x.text:'[image]').join(' '):''}
function render(){const l=$('list');l.innerHTML='';Object.entries(chats).reverse().forEach(([k,v])=>{const e=document.createElement('div');e.className='item '+(k===active?'active':'');e.textContent=v.title||'New chat';e.onclick=()=>{if(busy)return;active=k;save();render()};l.append(e)});const m=$('messages');m.innerHTML='';if(!active||!chats[active]?.history.length){m.innerHTML='<div class="empty"><div><div class="orb">✦</div><h1>Cosmic AI</h1><p>Pick a model and start chatting.</p></div></div>';return}chats[active].history.forEach(x=>add(x.role==='user'?'user':'ai',x.content,x.modelUsed));$('title').textContent=chats[active].title||'COSMIC AI';scroll()}
function add(role,c,model){const e=document.createElement('article');e.className='msg '+role;const h=document.createElement('div');h.className='head';h.textContent=role==='user'?'YOU':'✦ COSMIC'+(model?' • '+(MODEL_NAMES[model]||model):'');const b=document.createElement('div');b.className='bubble';if(role==='user')b.textContent=content(c);else b.innerHTML=marked.parse(content(c));e.append(h,b);$('messages').append(e);return e}
function activityData(text,model){const github=/\b(github|git|repo|repository|codebase|source code|file|files|folder|directory|project|worker\.js|index\.html|wrangler|workflow|commit|branch|apps\.json|cosmic)\b/i.test(text);const file=(text.match(/(?:[A-Za-z0-9_.-]+\/)*[A-Za-z0-9_.-]+\.(?:html?|css|js|json|md|yml|yaml|sh|toml|svg)/i)||[])[0];if(github)return[{t:'Understanding your request',d:'done'},{t:'Connecting to your Cosmic repository',d:'done'},{t:file?'Reading ':'Checking '}+ (file?`<span class="activity-file">${escapeHtml(file)}</span>`:'relevant repository files'),d:'active'},{t:'Preparing the answer',d:'pending'}];return[{t:'Understanding your request',d:'done'},{t:`Working with ${MODEL_NAMES[model]||model}`,d:'active'},{t:'Preparing the answer',d:'pending'}]}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function addWorking(model,text){const e=document.createElement('article');e.className='msg ai';e.id='working-message';const h=document.createElement('div');h.className='head';h.textContent='✦ COSMIC • '+(MODEL_NAMES[model]||model);const b=document.createElement('div');b.className='bubble';const steps=activityData(text,model);b.innerHTML='<div class="working"><div class="working-top"><span class="pulse"></span><span class="working-text">Cosmic is working</span><span class="dots"><span>•</span><span>•</span><span>•</span></span></div><div class="working-sub">Preparing a response…</div><div class="working-bar"><i></i></div><div class="activity" id="live-activity"><button class="activity-toggle" onclick="toggleActivity()"><span class="chevron">›</span><span>View activity</span></button><div class="activity-list">'+steps.map((s,i)=>`<div class="activity-step ${s.d}"><span class="mark"></span><span>${s.t}</span></div>`).join('')+'</div></div></div>';e.append(h,b);$('messages').append(e);scroll();
const subs=['Understanding your request…','Checking the connected context…','Reviewing relevant information…','Building the answer…','Polishing the response…'];let n=0;const sub=b.querySelector('.working-sub');activityTimer=setInterval(()=>{n=(n+1)%subs.length;if(sub)sub.textContent=subs[n];const list=b.querySelectorAll('.activity-step');if(list.length>1&&n%2===0){list.forEach((x,i)=>{x.classList.toggle('active',i===Math.min(2,list.length-1));x.classList.toggle('pending',i>Math.min(2,list.length-1));x.classList.toggle('done',i<Math.min(2,list.length-1))})}},1200);return e}
function toggleActivity(){document.getElementById('live-activity')?.classList.toggle('open')}
function removeWorking(){if(workingTimer){clearInterval(workingTimer);workingTimer=null}if(activityTimer){clearInterval(activityTimer);activityTimer=null}document.getElementById('working-message')?.remove()}
function scroll(){$('messages').scrollTop=$('messages').scrollHeight}
async function requestModel(model,messages){const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model,messages,stream:false}),signal:ctrl.signal});const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{throw Error('AI server returned an invalid response. Please try again.')}if(!r.ok)throw Error(d?.error?.message||d?.error||('AI server returned HTTP '+r.status));let answer=d?.choices?.[0]?.message?.content;if(typeof answer==='object'&&answer?.type==='text'&&typeof answer.contents==='string')answer=answer.contents;if(!answer)throw Error('No response content returned.');return answer}
async function send(){if(busy)return;const p=$('prompt'),text=p.value.trim();if(!text)return;ensure();const model=$('model').value,chat=chats[active];chat.history.push({role:'user',content:text});if(chat.title==='New chat')chat.title=text.slice(0,32);save();render();p.value='';busy=true;ctrl=new AbortController();$('send').disabled=true;$('status').className='status';$('status').textContent='Cosmic is working…';addWorking(model,text);try{let answer,used=model;try{answer=await requestModel(model,chat.history)}catch(first){if(model!=='openrouter/free'){used='openrouter/free';removeWorking();addWorking(used,text);answer=await requestModel('openrouter/free',chat.history)}else throw first}removeWorking();chat.history.push({role:'assistant',content:answer,modelUsed:used});save();render();$('status').textContent='Ready • '+(MODEL_NAMES[used]||used)}catch(e){removeWorking();if(e.name!=='AbortError'){$('status').className='status error';$('status').textContent='Cosmic AI error: '+e.message}}finally{busy=false;ctrl=null;$('send').disabled=false}}
$('prompt').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,180)+'px'});$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});render();
</script>
</body>
</html>
