<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07131a"><title>Cosmic AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"></script>
<style>
:root{--c:#3accff;--c2:#8fecff;--bg:#07131a;--panel:rgba(3,18,25,.88);--b:rgba(58,204,255,.28);--t:#eafaff;--m:#91b7c2}*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden}body{font:14px Arial;color:var(--t);background:var(--bg) url('https://i.makeagif.com/media/8-02-2016/yYXxa_.gif') center/cover fixed}body:before{content:"";position:fixed;inset:0;background:linear-gradient(135deg,rgba(3,13,18,.92),rgba(4,28,38,.74))}button,textarea,select{font:inherit}button{cursor:pointer}#app{position:relative;z-index:1;height:100%;display:flex}.side{width:280px;padding:18px;border-right:1px solid var(--b);background:rgba(2,12,17,.86);backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:10px}.brand{padding:8px 6px 18px;color:var(--c);font-weight:900;letter-spacing:2px}.brand b{display:inline-grid;place-items:center;width:34px;height:34px;margin-right:8px;border:1px solid var(--b);border-radius:12px}.new,.sidebtn,.icon,.send,.homebtn{border:1px solid var(--b);border-radius:11px;background:rgba(58,204,255,.07);color:var(--c2);padding:10px;font-weight:800}.sidebtn{text-align:left;background:transparent;color:var(--m)}.label{font-size:10px;color:#5d8a96;letter-spacing:1.5px;margin:14px 4px 3px}.list{flex:1;overflow:auto}.item{padding:10px;border-radius:10px;color:#b7d8df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item.active{background:rgba(58,204,255,.1);border:1px solid var(--b)}main{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}.top{height:64px;padding:0 24px;border-bottom:1px solid rgba(58,204,255,.13);display:flex;align-items:center;justify-content:space-between;background:rgba(2,13,18,.45);backdrop-filter:blur(14px);font-size:12px;font-weight:900;letter-spacing:1.8px}.actions{display:flex;gap:8px}.icon{width:38px;height:38px;padding:0}.homebtn{position:fixed!important;top:12px!important;left:12px!important;z-index:2147483647!important;display:block!important;padding:8px 14px!important;border:2px solid #2dccff!important;border-radius:10px!important;background:#0d1a21!important;color:#2dccff!important;box-shadow:0 4px 16px rgba(0,0,0,.55)!important}.homebtn:hover{background:#16303b!important}.messages{flex:1;overflow:auto;padding:28px 20px 150px}.empty{height:100%;display:grid;place-items:center;text-align:center}.empty div{max-width:620px}.orb{font-size:35px;color:var(--c)}h1{font-size:clamp(32px,5vw,54px);color:var(--c);letter-spacing:3px;text-shadow:0 0 24px rgba(58,204,255,.5);margin:12px}.empty p{color:var(--m);line-height:1.6}.msg{width:min(900px,100%);margin:0 auto 22px}.head{font-size:9px;color:#67aab9;font-weight:900;letter-spacing:1px;margin-bottom:7px;text-transform:uppercase}.bubble{width:fit-content;max-width:88%;padding:14px 16px;border-radius:16px;line-height:1.6;background:rgba(3,18,25,.68);border:1px solid rgba(58,204,255,.12);overflow-wrap:anywhere}.user .bubble{margin-left:auto;background:rgba(58,204,255,.1);border-color:rgba(58,204,255,.2)}.bubble pre{overflow:auto;background:#081116;padding:13px;border-radius:9px}.bubble code{background:rgba(0,0,0,.3);padding:2px 4px;border-radius:4px}.composer{position:absolute;bottom:0;left:0;right:0;padding:18px 20px 20px;background:linear-gradient(transparent,rgba(3,15,21,.97) 35%)}.box{width:min(900px,100%);margin:auto;padding:10px;border:1px solid var(--b);border-radius:18px;background:rgba(4,21,28,.92);backdrop-filter:blur(18px);display:flex;gap:8px;align-items:flex-end}textarea{flex:1;min-height:40px;max-height:180px;resize:none;border:0;outline:0;background:transparent;color:var(--t);padding:10px 4px}select{height:40px;max-width:245px;border:1px solid var(--b);border-radius:10px;background:#071a22;color:var(--c2);padding:0 8px;font-size:10px;font-weight:800}.send{width:40px;height:40px;padding:0}.status{font-size:10px;color:#78aab5;text-align:center;margin-top:7px}.error{color:#ff9d9d}.stop{display:none}.hidden{display:none!important}@media(max-width:560px){.side{position:absolute;z-index:5;height:100%;transform:translateX(-102%)}.side.open{transform:none}.box{flex-wrap:wrap}.box textarea{flex-basis:calc(100% - 48px)}select{max-width:none;flex:1}.homebtn{top:10px!important;left:10px!important;font-size:12px!important;padding:7px 11px!important}}
</style></head>
<body><button class="homebtn" id="cosmicHome" type="button" aria-label="Return to Cosmic apps">← Home</button><div id="app"><aside class="side" id="side"><div class="brand"><b>✦</b>COSMIC AI</div><button class="new" onclick="newChat()">＋ New chat</button><button class="sidebtn" onclick="clearHistory()">Clear history</button><div class="label">RECENT</div><div class="list" id="list"></div></aside><main><header class="top"><span id="title">COSMIC AI</span><div class="actions"><button class="icon" onclick="toggleSide()">☰</button></div></header><section class="messages" id="messages"></section><div class="composer"><div class="box"><textarea id="prompt" rows="1" placeholder="Message Cosmic AI..."></textarea><select id="model" aria-label="Choose AI model"><option value="openrouter/free">OpenRouter Free — Auto</option><option value="nvidia/nemotron-3-ultra-550b-a55b:free">NVIDIA Nemotron 3 Ultra — Free</option><option value="minimax/minimax-m3:free">MiniMax M3 — Free</option><option value="z-ai/glm-5.2:free">GLM 5.2 — Free</option><option value="google/gemma-4-26b-a4b-it:free">Gemma 4 26B — Free</option></select><button class="send" onclick="send()">➜</button></div><div class="status" id="status">Free AI models • secure server connection</div></div></main></div>
<script>
const ENDPOINT='https://cosmicv2.v75ultimate.workers.dev/api/ai',CH='cosmic_chats',AC='cosmic_active';let chats=JSON.parse(localStorage.getItem(CH)||'{}'),active=localStorage.getItem(AC)||null,busy=false,ctrl=null;
const $=id=>document.getElementById(id);$('cosmicHome').addEventListener('click',()=>{window.location.href='https://ultimate-guy.github.io/cosmic/apps/apps.html'});function save(){localStorage.setItem(CH,JSON.stringify(chats));active?localStorage.setItem(AC,active):localStorage.removeItem(AC)}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function newChat(){active=id();chats[active]={title:'New chat',history:[]};save();render();$('prompt').focus()}function ensure(){if(!active||!chats[active])newChat()}function clearHistory(){chats={};active=null;save();render()}function toggleSide(){$('side').classList.toggle('open')}
function content(c){return typeof c==='string'?c:Array.isArray(c)?c.map(x=>x.type==='text'?x.text:'[image]').join(' '):''}
function render(){const l=$('list');l.innerHTML='';Object.entries(chats).reverse().forEach(([k,v])=>{const e=document.createElement('div');e.className='item '+(k===active?'active':'');e.textContent=v.title||'New chat';e.onclick=()=>{active=k;save();render()};l.append(e)});const m=$('messages');m.innerHTML='';if(!active||!chats[active]?.history.length){m.innerHTML='<div class="empty"><div><div class="orb">✦</div><h1>Cosmic AI</h1><p>Pick a free model and start chatting.</p></div></div>';return}chats[active].history.forEach(x=>add(x.role==='user'?'user':'ai',x.content,x.modelUsed));$('title').textContent=chats[active].title||'COSMIC AI';scroll()}
function add(role,c,model){const e=document.createElement('article');e.className='msg '+role;const h=document.createElement('div');h.className='head';h.textContent=role==='user'?'YOU':'✦ COSMIC'+(model?' • '+model:'');const b=document.createElement('div');b.className='bubble';if(role==='user')b.textContent=content(c);else b.innerHTML=marked.parse(content(c));e.append(h,b);$('messages').append(e)}function scroll(){$('messages').scrollTop=$('messages').scrollHeight}
async function send(){if(busy)return;const p=$('prompt'),text=p.value.trim();if(!text)return;ensure();const model=$('model').value,chat=chats[active];chat.history.push({role:'user',content:text});if(chat.title==='New chat')chat.title=text.slice(0,32);save();render();p.value='';busy=true;ctrl=new AbortController();$('status').className='status';$('status').textContent='Cosmic is thinking…';try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model,messages:chat.history,stream:false}),signal:ctrl.signal});const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{throw Error('AI server returned an invalid response. Please try again.')}if(!r.ok)throw Error(d?.error?.message||d?.error||('AI server returned HTTP '+r.status));const answer=d?.choices?.[0]?.message?.content;if(!answer)throw Error('No response content returned.');chat.history.push({role:'assistant',content:answer,modelUsed:model});save();render();$('status').textContent='Free AI models • secure server connection';}catch(e){if(e.name!=='AbortError'){$('status').className='status error';$('status').textContent='Cosmic AI error: '+e.message}}finally{busy=false;ctrl=null}}
$('prompt').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,180)+'px'});$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});render();
</script></body></html>
